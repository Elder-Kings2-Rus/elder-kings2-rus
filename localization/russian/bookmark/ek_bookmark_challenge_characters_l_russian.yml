 # 450
 # Oreyn Bearclaw
 challenge_character_oreyn: "Вождь Орейн"
 challenge_character_oreyn_desc: "Орейн Медвежий Коготь, сын босмерского шамана и данмерки-мистика, в раннем возрасте отправился на поиски приключений и славы. После убийства ведьмы-змеи Гленвифаунвы Орейна прославляли как героя во всем Валенвуде, и он даже на короткое время получил место при дворе королевы Нилвен. Но до него дошли слухи, что его безжалостный отец с помощью нечестивой некромантии захватил Вудхарт. Услышав эту новость, Орейн помчался домой, собрав под свои знамёна племена Гриншейда, дабы спасти королевство.\n\n#bold Его мощь велика, но легионы нежити практически неисчислимы… Сможете ли вы одержать верх в неравной борьбе и сотворить легенду, что будет известна от Вудхарта до Шеогорада?#!"

 # Malgoth Blackroot
 challenge_character_malgoth: "$duke_feudal_male_bosmeris$ Малгот"
 challenge_character_malgoth_desc: "Большинство вождей лесных эльфов довольствуются тем, что защищают свои племена. Это не про Малгота — он мечтает стать королём Валенвуда. С начала своих завоеваний десять лет назад он вытеснил альтмерских колонистов и теперь ведёт войну против айлейдов из Хектахейма.\n\n#bold Сможет ли Малгот осуществить свои грандиозные амбиции и занять королевский трон, которого, как он сам верит, справедливо заслуживает? Или Малгот падёт, так и не достигнув бессмертной славы?#!"
 
 challenge_character_rilis: "Аран Торинан Рилис XII"
 challenge_character_rilis_desc: "Король Рилис всегда славился своими амбициями, но в последнее время он окончательно ступил на тёмный путь, тайно поклявшись в верности Молаг Балу и отрёкшись от поклонения аэдра.\n\n#bold Окажется ли его борьба за власть успешной, или же он погибнет подобно другим даэдрапоклонникам, что пытались закрепиться на островах?#!"

 challenge_character_zyg: "Вождь Зиг"
 challenge_character_zyg_desc: "Родившийся в южном Алиноре Зиг был изгнан из своего племени и отправился на север. Племя Костяной Хижины не спешило доверять чужаку, пока тот не защитил их вождя от покушения. Зиг безжалостно перебил предателей, получив поддержку смертельно раненого вождя. На похоронах он поклялся отомстить кин-владениям Клаудреста...\n\n#bold Сможет ли Зиг исполнить кровную клятву, данную своему покровителю? Или же его опрометчивое обещание навлечёт гибель на Калкракт?#!"