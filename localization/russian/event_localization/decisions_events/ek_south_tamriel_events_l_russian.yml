l_russian:
 south_tamriel.0001.t:0 "Свет Арнезии"
 south_tamriel.0001.desc:0 "Ах, Арнезия – могущественная крепость-королевство кантемирцев!\n\nОна была основана именно в том месте, где мудрая оракул Кантемир, по слухам, достигла просветления и познала истину при помощи своих учителей-Хист. Арнезия, как и её города-побратимы Архонт и Торн, служила надёжным убежищем в этой негостеприимной земле. Судьбы кантемирских кланов были переменчивы, полны взлётов и падений, но они цепко держались за эти топкие берега.\n\nНо после периода медленного упадка велотийцы вновь возвысились. Сокрушив всех врагов, [ROOT.Char.GetFullNameNicknamedNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'присоединила', 'присоединил' )] все земли к югу от крепости до Архонта, восстановив давно исчезнувшее королевство Арнезия.\n\nВскоре котринги, аргониане и, возможно, многие другие народы убедятся, что камень кантемирских стен и их вера тверды и непоколебимы."
 south_tamriel.0001.a:0 "Арнезия, моя любимая..."

 south_tamriel.0011.t:0 "Болота слёз"
 south_tamriel.0011.desc:0 "После бесчисленных набегов и войн, устроенных жителями Болота Слёз, этот регион наконец-то перешёл под наш контроль.\nНаша администрация неустанно работала над интеграцией Болота Слёз, так что теперь его жители и правящий класс называют Чернотопье своим домом."
 south_tamriel.0011.a:0 "Больше никаких набегов и войн."

 # it's a very simple event with simple desc, not gonna bother making too unique descs for it
 south_tamriel.0012.t:0 "Болота слёз"
 south_tamriel.0012.desc:0 "После бесчисленных набегов и войн, устроенных жителями Болота Слёз, этот регион наконец-то перешёл под наш контроль.\nНаша администрация неустанно работала над интеграцией Болота Слёз, так что теперь его жители и правящий класс называют Кантемирис своим домом."
 south_tamriel.0012.a:0 "Больше никаких набегов и войн."

 south_tamriel.0013.t:0 "Болота слёз"
 south_tamriel.0013.desc:0 "После бесчисленных набегов и войн, устроенных жителями Болота Слёз, этот регион наконец-то перешёл под наш контроль.\nТеперь наша администрация должна неустанно работать над реинтеграцией Болота Слёз, чтобы устранить ущерб, нанесённый сердцам и умам его жителей."
 south_tamriel.0013.a:0 "Справедливость восторжествовала!"

 south_tamriel.0014.t: "Новое племя"
 south_tamriel.0014.desc: "Наш народ нашёл сильного и расчётливого неприятеля в лице людей с запада, которые веками сражались с нами за эту землю. Бесконечная резня не принесла нам мира, но, сражаясь с ними, мы переняли систему торговли и иерархию чужаков.\n\nВозможно, что единственный способ одолеть этого противника — стать подобным ему. Перемены и адаптация — сама суть нашего народа, и сейчас выпал редкий шанс задать им направление."
 south_tamriel.0014.option.1: "Городские магократы сведущи в законе и мудры, к ним стоит прислушаться."
 south_tamriel.0014.option.1.tooltip: "#L [ojel_culture.GetCollectiveNoun]ая#! [culture|El] получит [Concept('tradition', 'традицию')|E] «[GetCultureTradition('tradition_imperial_battlemages').GetName]»"
 south_tamriel.0014.option.2: "Сельский мистицизм куда ближе нашему духу."
 south_tamriel.0014.option.2.tooltip: "#L [ojel_culture.GetCollectiveNoun]ая#! [culture|El] получит [Concept('tradition', 'традицию')|E] «[GetCultureTradition('tradition_ut_nibenu_folklore').GetName]»"
 south_tamriel.0014.option.3: "Наше новое племя должно развиваться естественным путём."