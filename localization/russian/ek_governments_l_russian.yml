 action_autocracy_assign_tax_payers_label: "@tax_collector_icon! У вашего сборщика налогов нет налогоплательщиков"
 action_autocracy_assign_tax_payers_desc: "Вы не облагаете налогом [Concept('autocracy', 'автократических')|E] [Concept('vassals', 'вассалов')|E].\n\n#help [Concept('tax_jurisdiction', 'Налоговая юрисдикция')|E], в которой есть [Concept('tax_collector', 'сборщик налогов')|E], но нет [Concept('taxpayers', 'налогоплательщиков')|E], не будет приносить [Concept('gold', 'золота')|E] и [Concept('levy', 'ополченцев')|E]. Назначьте автократических вассалов на роль налогоплательщиков, чтобы собирать с них налоги.#!"
