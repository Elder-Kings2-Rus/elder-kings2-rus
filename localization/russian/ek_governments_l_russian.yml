 action_autocracy_appoint_tax_collector_label: "@tax_collector_icon! Вы не облагаете налогом своих вассалов"
 action_autocracy_appoint_tax_collector_desc: "Вы не облагаете налогом [Concept('autocracy', 'автократических')|E] [Concept('vassals', 'вассалов')|E].\n\n#help [Concept('tax_collectors', 'Сборщики налогов')|E] занимаются сбором [Concept('levies', 'ополчения')|E] и [Concept('gold', 'золота')|E] с ваших автократических вассалов. Вам следует назначить сборщика налогов и распределить [Concept('taxpayers', 'налогоплательщиков')|E] по [Concept('tax_jurisdictions', 'налоговым юрисдикциям')|E].#!"
 action_autocracy_appoint_tax_collector_click: "#I Щелкните, чтобы просмотреть#!"

