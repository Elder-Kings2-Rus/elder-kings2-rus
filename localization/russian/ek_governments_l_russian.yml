 praxis_government_adjective:0 "Праксическ"
 praxis_government_realm:0 "Церемониархия"
 praxis_government_desc:1 "#F Церемониархия - сложная система обрядов и обычаев, сосредоточенная на подражании древнему [Glossary( 'Альдмерису', 'ALDMERIS_GLOSS' )]. Во многом имеются общие черты с феодальными монархиями - вассалы, предоставляющие сюзерену [Concept('soldiers', 'ополчение')|E] и выплачивающие ему [Concept('taxes', 'налоги')|E]. В то же время, церемониархии свойственна жесткая социальная иерархия и расслоение, установленные в соответствии с альтмерской философией.#!" #by adhering to ancient rites, the ruler proves their rightful position in the social hierarchy, and keeps their Aedric lineage pure.
 rejected_ceremoniarchy:0 "Отвергает церемониархию"
 ceremoniarchy_rejection_title:0 "Вассал отвергает церемониархию!"
 ceremoniarchy_rejection_desc:0 "Мой вассал, [dissident.GetTitledFirstName], отвергает обычаи [Concept('ceremoniarchy', 'церемониархии')|E] и предпочел принять варварские феодальные устои."
